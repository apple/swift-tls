name: Pull request

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  tests:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.16
    with:
      enable_macos_checks: true
      macos_exclude_xcode_versions: "[{\"xcode_version\": \"swift_6.1\"}, {\"xcode_version\": \"swift_6.2\"}]"
      linux_exclude_swift_versions: '[{"swift_version": "6.1"}, {"swift_version": "6.2"}]'
      linux_build_command: |
        swift test -c release
      enable_windows_checks: false
      enable_android_sdk_build: true
      enable_android_sdk_checks: true
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@main
    with:
      unacceptable_language_check_enabled: false
      format_check_enabled: false
      license_header_check_enabled: true
      api_breakage_check_enabled: false
      shell_check_enabled: false
      license_header_check_project_name: "Swift"
      api_breakage_check_container_image: "swiftlang/swift:nightly-6.3-jammy"
